<div class="bg-light min-vh-100 d-flex justify-content-center align-items-center py-5">  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-4 p-sm-5">

            <div class="text-center mb-4">
              <h3 class="fw-bold mb-1">Iniciar Sesión</h3>
              <p class="text-muted small">
                Ingresa tus credenciales para continuar
              </p>
            </div>

            <form [formGroup]="login" (ngSubmit)="envio()">

              <!-- Usuario -->
              <div class="mb-3">
                <label for="usuario" class="form-label small fw-semibold">
                  Usuario
                </label>

                <input
                  type="text"
                  class="form-control fs-6"
                  formControlName="usuario"
                  [class.is-invalid]="invalido('usuario')"
                  id="usuario"
                  name="usuario"
                  placeholder="Ingresa tu usuario"
                  required>

                @if (invalido('usuario')) {
                  <div class="invalid-feedback">
                    El usuario es requerido
                  </div>
                }
              </div>

              <!-- Contraseña -->
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">

                  <label for="password" class="form-label small fw-semibold">
                    Contraseña
                  </label>

                  <a href="#" class="small text-decoration-none">
                    ¿Olvidaste tu contraseña?
                  </a>

                </div>

                <input
                  type="password"
                  class="form-control fs-6"
                  formControlName="contrasena"
                  [class.is-invalid]="invalido('contrasena')"
                  id="password"
                  name="password"
                  placeholder="••••••••"
                  required>

                @if (invalido('contrasena')) {
                  <div class="invalid-feedback">
                    La contraseña es requerida
                  </div>
                }
              </div>

              @if (error())  {
                <p class="error">{{error()}}</p>
              }

              <!-- Botón -->
              <div class="d-grid mb-3">
                <button
                  type="submit"
                  class="btn btn-primary btn-lg fs-6 fw-semibold py-2 " [disabled]="loading()">
                  {{loading()? 'Ingresando..': 'Ingresar'}}
                  
                </button>
              </div>

            </form>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
